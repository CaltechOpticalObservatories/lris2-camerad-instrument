ARCHON_IP=10.0.0.2
ARCHON_PORT=4242
DEFAULT_FIRMWARE=/home/l2dev/apps/camera-interface/camerad/Instruments/lris2/config/LRIS2.acf
EXPOSE_PARAM=framecount           # Archon parameter which triggers exposure
ABORT_PARAM=abort_integration     # Archon parameter to trigger an abort
EXPTIME_SEC_PARAM=etime_illum_s   # Archon parameter holding exposure seconds
EXPTIME_MSEC_PARAM=etime_illum_ms # Archon parameter holding exposure milliseconds
READOUT_TIME=5000                 # Timeout waiting for new frame (ms) 
WRITE_TAPINFO_TO_FITS=no          # Tapinfo (gain, offset) be written to FITS headers {yes|no}

IMDIR=/home/l2dev/apps/camerad-images         # base directory to save images
BASENAME=image                    # base image filename

# Asynchronous FITS writer. Without these no exposure is written anywhere,
# since IMDIR and BASENAME above drive the imdir and basename commands only
FITS_ENABLED=yes
FITS_OUTPUT_DIR=/home/l2dev/apps/camerad-images
FITS_AUTODIR=no
FITS_BASENAME=lris2

DIRMODE=0077
TM_ZONE_LOG=local                  # time zone for log entries only, can be "UTC" or "local"
TM_ZONE=UTC                        # time zone for everything else, can be "UTC" or "local"
TZ_ENV=PST8PDT,M3.2.0/2,M11.1.0/2  # TZ ENV variable to use when TM_ZONE_* is "local" (follows POSIX standard)
AUTODIR=no
LONGERROR=true

NBPORT=3030                       # server non-blocking port
BLKPORT=3031                      # server blocking port
ASYNCGROUP=239.1.1.234           # asynchronous broadcast group (or "none")
ASYNCPORT=1234                   # asynchronous message port (if ASYNCGROUP defined)
#ASYNCGROUP=none
LOGPATH=/home/l2dev/apps/camerad-logs  # fully qualified path to save log files
#LONGEXPOSURE=True                # exptimes in seconds (not ms)
